services:
  ros2-dev:
    image: ros2-gazebo-dev:jazzy
    container_name: ros-jazzy-container
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    working_dir: /ros2_ws
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: "0"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      GZ_SIM_RESOURCE_PATH: /ros2_ws/src
      GZ_SIM_SYSTEM_PLUGIN_PATH: /opt/ros/jazzy/lib:/ros2_ws/install/lib
      LD_LIBRARY_PATH: /opt/ros/jazzy/lib:/ros2_ws/install/lib
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - .:/ros2_ws
      - /etc/localtime:/etc/localtime:ro
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
    # Descomente esta seção se a máquina tiver GPU NVIDIA.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: ["gpu"]